name: Ruff Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Ruff Check with SARIF output
        run: |
          pip install ruff
          ruff check src/ tests/ --output-format=sarif > ruff-results.sarif
        continue-on-error: true

      - name: Upload Ruff Results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ruff-results.sarif
          category: ruff
